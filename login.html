<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - لوحة التحكم</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background: #f4f6f8;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .login-card {
            background: #fff;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .login-card h2 {
            margin-bottom: 8px;
            color: #102a24;
            font-size: 24px;
            font-weight: 800;
        }

        .login-card p {
            color: #666;
            font-size: 13px;
            margin-bottom: 25px;
        }

        .input-field {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }

        .input-field:focus {
            border-color: #2d725e;
        }

        .btn-login {
            width: 100%;
            padding: 13px;
            background: #102a24;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-login:hover {
            background: #1f5647;
        }

        #loginStatus {
            margin-top: 15px;
            font-size: 13px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="login-card">
        <h2>🏆 تسجيل دخول المدير</h2>
        <p>أدخل بيانات الحساب للوصول إلى لوحة التحكم</p>

        <input type="email" id="adminEmail" class="input-field" placeholder="البريد الإلكتروني للمدير" required>
        <input type="password" id="adminPassword" class="input-field" placeholder="كلمة السر" required>

        <button id="loginBtn" class="btn-login">تسجيل الدخول</button>
        <p id="loginStatus"></p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDgxDfzysrUhM_uXpM6u98bRAuEUGhNmn0",
            authDomain: "mohamed-sport-store1.firebaseapp.com",
            projectId: "mohamed-sport-store1",
            storageBucket: "mohamed-sport-store1.firebasestorage.app",
            messagingSenderId: "488043726196",
            appId: "1:488043726196:web:3ff24ef18c1ae78c4d5821"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        document.getElementById('loginBtn').addEventListener('click', async () => {
            const email = document.getElementById('adminEmail').value.trim();
            const password = document.getElementById('adminPassword').value;
            const status = document.getElementById('loginStatus');

            if (!email || !password) {
                status.innerText = "يرجى كتابة البريد وكلمة السر!";
                status.style.color = "red";
                return;
            }

            status.innerText = "جاري التحقق من البيانات...";
            status.style.color = "blue";

            try {
                await signInWithEmailAndPassword(auth, email, password);
                status.innerText = "✅ تم تسجيل الدخول بنجاح! جاري التوجيه...";
                status.style.color = "green";
                setTimeout(() => {
                    window.location.href = "admin.html";
                }, 1000);
            } catch (error) {
                console.error(error);
                status.innerText = "❌ البريد أو كلمة السر غير صحيحة!";
                status.style.color = "red";
            }
        });
    </script>

</body>

</html>
